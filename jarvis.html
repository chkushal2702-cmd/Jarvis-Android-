<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>JARVIS</title>

        <style>
            * {
                  box-sizing: border-box;
                      }

                          body {
                                margin: 0;
                                      min-height: 100vh;
                                            background: radial-gradient(circle at center, #15152e 0%, #050509 70%);
                                                  color: white;
                                                        font-family: Arial, sans-serif;
                                                              display: flex;
                                                                    justify-content: center;
                                                                          align-items: center;
                                                                                overflow: hidden;
                                                                                    }

                                                                                        .jarvis {
                                                                                              width: 90%;
                                                                                                    max-width: 600px;
                                                                                                          text-align: center;
                                                                                                              }

                                                                                                                  .orb {
                                                                                                                        width: 180px;
                                                                                                                              height: 180px;
                                                                                                                                    margin: 0 auto 35px;
                                                                                                                                          border-radius: 50%;
                                                                                                                                                border: 3px solid #00eaff;
                                                                                                                                                      box-shadow:
                                                                                                                                                              0 0 20px #00eaff,
                                                                                                                                                                      0 0 50px #006eff,
                                                                                                                                                                              inset 0 0 30px #006eff;
                                                                                                                                                                                    display: flex;
                                                                                                                                                                                          align-items: center;
                                                                                                                                                                                                justify-content: center;
                                                                                                                                                                                                      font-size: 32px;
                                                                                                                                                                                                            font-weight: bold;
                                                                                                                                                                                                                  color: #00eaff;
                                                                                                                                                                                                                        animation: pulse 2s infinite;
                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                @keyframes pulse {
                                                                                                                                                                                                                                      0%, 100% {
                                                                                                                                                                                                                                              transform: scale(1);
                                                                                                                                                                                                                                                      box-shadow: 0 0 20px #00eaff, 0 0 50px #006eff;
                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                  50% {
                                                                                                                                                                                                                                                                          transform: scale(1.05);
                                                                                                                                                                                                                                                                                  box-shadow: 0 0 35px #00eaff, 0 0 80px #006eff;
                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                h1 {
                                                                                                                                                                                                                                                                                                      letter-spacing: 8px;
                                                                                                                                                                                                                                                                                                            margin-bottom: 8px;
                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                    .status {
                                                                                                                                                                                                                                                                                                                          color: #7d8cff;
                                                                                                                                                                                                                                                                                                                                margin-bottom: 30px;
                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                        button {
                                                                                                                                                                                                                                                                                                                                              border: 2px solid #00eaff;
                                                                                                                                                                                                                                                                                                                                                    background: transparent;
                                                                                                                                                                                                                                                                                                                                                          color: #00eaff;
                                                                                                                                                                                                                                                                                                                                                                padding: 16px 35px;
                                                                                                                                                                                                                                                                                                                                                                      border-radius: 40px;
                                                                                                                                                                                                                                                                                                                                                                            font-size: 18px;
                                                                                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                        box-shadow: 0 0 15px #00eaff;
                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                button:active {
                                                                                                                                                                                                                                                                                                                                                                                                      transform: scale(0.95);
                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                              .response {
                                                                                                                                                                                                                                                                                                                                                                                                                    margin-top: 30px;
                                                                                                                                                                                                                                                                                                                                                                                                                          min-height: 50px;
                                                                                                                                                                                                                                                                                                                                                                                                                                color: #ddd;
                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 18px;
                                                                                                                                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                            </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                            <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="jarvis">

                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="orb">J</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                      <h1>JARVIS</h1>

                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="status" id="status">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                System ready.
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button onclick="startListening()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              🎙️ TALK TO JARVIS
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="response" id="response">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            Awaiting command...
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const statusText = document.getElementById("status");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const responseText = document.getElementById("response");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const SpeechRecognition =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.SpeechRecognition ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            window.webkitSpeechRecognition;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let recognition;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (SpeechRecognition) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          recognition = new SpeechRecognition();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                recognition.lang = "en-IN";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      recognition.continuous = false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            recognition.interimResults = false;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  recognition.onstart = function () {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          statusText.textContent = "Listening...";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  responseText.textContent = "I'm listening, boss.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              recognition.onresult = function (event) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const command =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                event.results[0][0].transcript.toLowerCase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        responseText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "You said: " + command;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          processCommand(command);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      recognition.onerror = function () {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              statusText.textContent = "Microphone error.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      speak("I couldn't hear you properly, boss.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  recognition.onend = function () {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          statusText.textContent = "System ready.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          statusText.textContent =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  "Voice recognition is not supported here.";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          function startListening() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!recognition) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        speak("Voice recognition isn't available in this browser.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            recognition.start();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function processCommand(command) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          if (command.includes("hello") ||
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    command.includes("hi jarvis")) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            respond("Hello boss. JARVIS is online.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else if (command.includes("your name")) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                respond("My name is JARVIS. Your personal assistant.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if (command.includes("time")) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const now = new Date();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const time = now.toLocaleTimeString(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      "en-IN",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            hour: "numeric",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        minute: "2-digit"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  respond("The current time is " + time + ".");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              else if (command.includes("open google")) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      respond("Opening Google.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        window.open("https://www.google.com", "_blank");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else if (command.includes("go home")) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    respond("Going home, boss.");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            setTimeout(() => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      window.location.href = "https://github.com";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }, 1000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          else {
